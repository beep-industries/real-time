version: "3.9"

services:
  app:
    build: .
    container_name: beep-realtime-app
    ports:
      - "4000:4000"
    environment:
      # Phoenix (Production mode)
      - MIX_ENV=prod
      - PORT=4000
      - SECRET_KEY_BASE=${SECRET_KEY_BASE:-please_generate_a_secret_key_base_using_mix_phx_gen_secret}
      - PHX_HOST=${PHX_HOST:-localhost}
      # OIDC Configuration
      - KEYCLOAK_URL=${KEYCLOAK_URL:-http://localhost:8080}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-myrealm}
      # Redis (for deduper)
      - REDIS_URL=redis://redis:6379/0
      # SFU gRPC address (set to where your SFU gRPC server is listening)
      # If the SFU runs on the HOST, containers cannot reach it via 127.0.0.1.
      # On macOS/Windows Docker Desktop you can use host.docker.internal; on Linux consider the host-gateway feature.
      - SFU_GRPC_ADDR=127.0.0.1:50052
    network_mode: "host"
#    depends_on:
#      - redis

