version: "3.9"

services:
  app:
    build: .
    container_name: beep-realtime-app
    ports:
      - "4000:4000"
    environment:
      # Phoenix
      - MIX_ENV=dev
      - PORT=4000
      - PHX_SERVER=true
      # Redis (for deduper)
      - REDIS_URL=redis://redis:6379/0
      # SFU gRPC address (set to where your SFU gRPC server is listening)
      # If the SFU runs on the HOST, containers cannot reach it via 127.0.0.1.
      # On macOS/Windows Docker Desktop you can use host.docker.internal; on Linux consider the host-gateway feature.
      - SFU_GRPC_ADDR=127.0.0.1:50051
    network_mode: "host"
#    depends_on:
#      - redis

