version: "3.9"

services:
  app:
    build: .
    container_name: beep-realtime-app
    ports:
      - "4000:4000"
    environment:
      # Phoenix
      - MIX_ENV=dev
      - PORT=4000
      - PHX_SERVER=true
      # Redis (for deduper)
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: beep-realtime-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
